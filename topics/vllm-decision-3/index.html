<script>window.__MD__ = "# Decision 3.0 — vLLM Semantic Router's open multimodal decision models\n\n> Ingested 2026-10-14 from MarkTechPost's announcement coverage (via search, see Sources),\n> OrcaRouter's detailed release analysis, the Hugging Face `vllm-sr` org, and the vLLM Semantic\n> Router project site. Part of the [decision-models-overview](/wiki/topics/decision-models-overview/) category\n> — the \"purpose-built decision model\" school, alongside Jev, Laya, Strands Decider 2B, and Wazn.\n\n## What it is\n\nDecision 3.0 is a family of **six** open-weight decision models released 2026-10-10/11 by **vLLM\nSemantic Router** (`vllm-sr`), the project behind an open, programmable routing layer for LLM\ninference (\"Intelligence Beyond Any One Model\" — vllm-sr.ai). Unlike every other vendor on this\npage's category, Decision 3.0 was not built by a company selling a decision model as its product —\nit was built by a routing project to power its own core function: deciding which request goes to\nwhich backend model.\n\nThe Decision 3.0 request contract: a `state` (text or JSON, optionally with images and video) plus a\ndictionary of named questions. Each question is typed as **Choice** (multiple options), **Noul**\n(yes/no), or **Score** (continuous rating) — the same three-primitive shape as Jev/Laya/Strands\nDecider, confirming `Choice`/`Score`/`Noul` (or equivalent) as the emerging lingua franca across this\nwhole category rather than one vendor's naming choice. All questions in a request are answered in a\nsingle call, each returning a full probability distribution, not just a top pick.\n\n## Model family\n\n| Model | Parameters | Vision encoder | Base model |\n|---|---|---|---|\n| d3-edge | 0.59B | 0.10B | Qwen3.5-0.8B |\n| d3-lite | 0.85B | 0.10B | Qwen3.5-0.8B |\n| d3-nano | 2.21B | 0.33B | Qwen3.5-2B |\n| d3-mini | 4.54B | 0.33B | Qwen3.5-4B |\n| d3-flash | 8.39B | 0.46B | Qwen3.5-9B |\n| **d3** (flagship) | 26.09B | 0.46B | Qwen3.8-27B |\n\nAll six are fine-tunes of a Qwen base model (Qwen3.5 for the five smaller sizes, Qwen3.8-27B for the\nflagship), all released under **Apache 2.0**, with safetensors weights, custom modeling code\n(`modeling_d3.py`, `d3_engine.py`, `d3_server.py`), and file-level SHA-256 hashes for\nreproducibility. This is the widest parameter-count spread of any vendor in this category — d3-edge\nat 0.59B is smaller than any Strands Decider or Laya checkpoint, while flagship d3 at 26B dwarfs\nevery other model on the [cross-vendor comparison table](/wiki/topics/decision-models-overview/#cross-vendor-comparison-as-of-2026-10-03),\nexplicitly trading size for accuracy and letting teams pick a point on that curve.\n\n## Multimodal input\n\nThe one capability this family shares with OpenAI's Decisions API but no other purpose-built model\nin this category: **image and video input**, not just text/JSON state.\n\n- **Images:** PNG, JPEG, WebP, up to 1.6 megapixels, multiple per request.\n- **Video:** MP4, WebM, MOV, MKV, sampled at 2 fps, max 32 frames, 0.2 megapixels/frame.\n\nThis makes Decision 3.0 the only model in the *purpose-built* school with confirmed multimodal\ninput — previously that was OpenAI's differentiator precisely because it's built on a generative\nvision-language model (GPT-6 Luna) rather than a stripped-down encoder. Decision 3.0 achieves it\nwith a dedicated vision encoder (0.10B–0.46B depending on size) bolted onto the Qwen backbone instead.\n\n## Benchmark performance\n\nVendor-reported scores on the **Jev Decision Index v0.3.1** public suite (as of 2026-10-10):\n\n| Model | Score | vs. Decision 2.0 (predecessor) |\n|---|---|---|\n| d3 (26B) | 65.5 | +8.5 |\n| d3-flash (8.4B) | 57.79 | +11.0 |\n| d3-mini (4.5B) | 54.90 | +10.7 |\n| d3-nano (2.2B) | 42.22 | +12.2 |\n| d3-lite (0.85B) | 36.93 | +16.4 |\n| d3-edge (0.59B) | 28.82 | +12.1 |\n\nCompetitive context on the same board, same date:\n\n| System | Score |\n|---|---|\n| **d3** | **65.5** |\n| Perplexity Decider v1.1 (27B) | 62.8 |\n| Fastino GLiDE no-thinking (28B) | 60.2 |\n| Jev | 60.1 |\n| Torchcast Decision 27B | 59.9 |\n| Decision 2.0 (predecessor) | 55.9–57.0* |\n\n*Two slightly different Decision 2.0 baseline figures appeared across sources (55.9 vs 57.0);\nnot reconciled at ingestion time.\n\nVision performance (Perception Test, 19,140 validation questions, 33.3% chance baseline):\n\n| Model | Accuracy |\n|---|---|\n| d3 | 77.4% |\n| d3-edge | 46.6% |\n\n**Important caveat, flagged by OrcaRouter's own analysis:** all of these numbers are internal\nvLLM-SR evaluations — at ingestion time there is **zero third-party reproduction**. The article also\nflags two further documentation gaps: no stated input token ceiling (Decision 1.0 published explicit\nlimits — 1,024 encoder / 16,384 decoder — Decision 3.0 does not), and no calibration metrics\npublished (no Brier score or ECE, despite calibration being treated as fundamental elsewhere in this\ncategory — contrast Strands Decider's published ECE of 0.052 and Laya's 0.081).\n\n### \"Jev Decision Index\" vs \"JevBench\" — a naming note\n\nThis is a different benchmark name than the **JevBench v1.4.2** board cited on\n[aws-strands-decider](/wiki/topics/aws-strands-decider/#jevbench-performance) (0.723 accuracy, rank 50/231).\nBoth trace back to community/third-party benchmarking efforts around Jev-style decision models\n(JevBench by Benchmark Heaven; a separate \"Decision Index\" / \"Jev Decision Index\" effort with its\nown GitHub reproduction tooling), but they do not appear to be the same project under two names —\ntreat scores from the two boards as **not directly comparable** until this is clarified by a future\ningest. Jev's own score appears on both boards (0.723 vs JevBench's methodology; 60.1 vs Jev Decision\nIndex's), which on its face confirms they use different scales/methodologies, not just different\nsnapshots of the same one.\n\n## Latency\n\nSingle-request, single-GPU, measured on one AMD Instinct MI325X:\n\n| Model | Text (median) | Image (median) | 10s video (median) |\n|---|---|---|---|\n| d3 | 55ms | 273ms | 553ms |\n| d3-edge | 6.7ms | 41.9ms | 308.3ms |\n\nd3's 55ms text latency is faster than Strands Decider 2B's 115ms p50 (RTX 3090) despite being\n~14× larger in parameter count — different hardware (MI325X vs RTX 3090) makes this not a clean\napples-to-apples comparison, but it is a notable data point against the assumption that this\ncategory's latency scales straightforwardly with model size.\n\n## Relationship to vLLM Semantic Router (the routing project)\n\nvLLM Semantic Router is an open, programmable decision layer for routing inference requests across\nheterogeneous model fleets (closed models like Claude/OpenAI/Gemini alongside open models like\nDeepSeek/Mistral/Llama), optimizing for quality, latency, cost, privacy, and safety. Maintainers\ninclude contributors from AMD, Microsoft, Delta Electronics, Red Hat, Google, and Meta. Decision 3.0\nmodels are the routing project's own internal decision-making component, released publicly — routing\npolicy is expressed as YAML `routing.decisions[]` rules (conditions, candidate models, algorithm,\npriority), and `vllm-sr route preview --prompt \"...\"` lets you test routing decisions without\ncalling a backend. This is a different origin story than every other page in this category: Jev,\nLaya, Strands Decider, Wazn, and OpenAI's Decisions API are all products sold *as* decision models;\nDecision 3.0 is a routing project's internal component that got open-sourced.\n\nThe project also documents a System One request-format compatibility: Decision 3.0 implements the\nsame state-and-named-questions contract used by hosted Jev models, meaning existing Jev-integrated\npipelines may be able to swap in a self-hosted Decision 3.0 model with limited rework.\n\nThe 96-model family across \"Decision, Vela, and Mixture-of-Models (MoM)\" lines has reportedly\nreached ~143,000 Hugging Face downloads as of October 2026, and the Decision 3.0 launch post reached\n#1 on r/LocalLLaMA's hot feed within five hours (224 upvotes, 272 shares) — the strongest organic\ncommunity reception of any release covered in this category so far, exceeding even Jev's own launch\n(691 Hacker News points for \"Jev in 25 Lines of Python\" is still the largest raw number, but on a\ndifferent platform/metric; not directly comparable).\n\n## Licensing and reproducibility\n\nAll six checkpoints: Apache 2.0, safetensors, custom modeling code, file-level SHA-256 hashes\npublished for integrity verification — comparable in openness to Strands Decider 2B's \"full training\nrecipe, not just weights\" commitment, though Decision 3.0's announcement materials emphasize\nartifact-hash reproducibility specifically rather than publishing the training recipe itself.\n\n## Limitations\n\n- **No independent benchmark verification** at ingestion time — every number above is vendor\n  (vLLM-SR)-reported.\n- **No calibration metrics published** — a real gap relative to Strands Decider, Laya, and Jev, all\n  of which publish ECE figures.\n- **No documented input token ceiling** — unusual given the predecessor (Decision 1.0) published one.\n- **Benchmark naming confusion** — see the Jev Decision Index vs JevBench note above; don't assume\n  scores are comparable across the two boards without checking methodology.\n- Latency figures are single-GPU, single-request — no published behavior under concurrent load.\n\n## Related pages\n\n- [decision-models-overview](/wiki/topics/decision-models-overview/) — category hub: cross-vendor comparison,\n  two architectural schools, decision guide\n- [aws-strands-decider](/wiki/topics/aws-strands-decider/) — closest benchmark-scale sibling (d3-nano at 2.2B\n  vs Strands Decider at 1.9B), both reporting JevBench/Jev-Decision-Index-family scores\n- [wazn-decision-model](/wiki/topics/wazn-decision-model/) — a second new entrant from the same ingestion pass\n  (2026-10-14)\n- [openai-decisions-api](/wiki/topics/openai-decisions-api/) — the only other model in this category with\n  confirmed multimodal (image) input, via the opposite architectural route (constrained generative\n  vs. dedicated vision encoder)\n\n## Sources\n\nRetrieved 2026-10-14. The original MarkTechPost article\n(`marktechpost.com/2026/10/11/what-is-decision-3-0-vllm-semantic-routers-new-open-decision-models/`)\nreturned HTTP 403/429 on direct fetch; content below is reconstructed from search-engine summaries\nof that article plus the independently-fetched sources below.\n\n- MarkTechPost — [What is Decision 3.0? vLLM Semantic Router's New Open Decision Models](https://www.marktechpost.com/2026/10/11/what-is-decision-3-0-vllm-semantic-routers-new-open-decision-models/) (fetched via search summary only — direct fetch blocked)\n- OrcaRouter — [Decision 3.0 Is on Hugging Face: Six Open Multimodal Models](https://www.orcarouter.ai/blog/decision-3-0-open-multimodal-decision-models)\n- Hugging Face — [vllm-sr/d3](https://huggingface.co/vllm-sr/d3), [vllm-sr org](https://huggingface.co/vllm-sr)\n- vLLM Semantic Router project site — [vllm-sr.ai](https://vllm-sr.ai/)\n- GitHub — [vllm-project/semantic-router](https://github.com/vllm-project/semantic-router), `src/vllm-sr/README.md`\n- AICoder — [vLLM Semantic Router open-sources Decision 3.0](https://aicoder.com/news/news-20261012-vllm-sr-decision-3-open-multimodal-decision-models) (referenced via search, not independently fetched)\n- ccleaks — [vLLM Semantic Router Releases Decision 3.0 Open-Weight Decision Models](https://ccleaks.com/news/decision-3-0-open-weights-oct-2026) (referenced via search, not independently fetched)\n";</script>
