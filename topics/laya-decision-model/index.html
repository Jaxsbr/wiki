<script>window.__MD__ = "# Laya — open-source decision model\n\n> Ingested 2026-09-23 from Zima Space. Source: https://shop.zimaspace.com/blogs/tech-ai-hub/laya-open-source-decision-model-local-ai\n> Split out 2026-10-03 from [jev-as-a-judge-evals](/wiki/topics/jev-as-a-judge-evals/) into its own page as\n> part of the [decision-models-overview](/wiki/topics/decision-models-overview/) category rework — Laya is a\n> sibling decision model, not a Jev-specific footnote. See that hub for the cross-vendor comparison\n> against Jev, AWS Strands Decider 2B, and OpenAI's Decisions API.\n\nLaya (Convai Innovations, released ~2026-09-18) is an Apache 2.0 open-weight decision model that\nuses the same primitive vocabulary as Jev — `choice`, `score`, `noul` — but runs locally without an\nAPI key. It is a BERT-family bidirectional encoder, not a text generator, making it architecturally\none of the closest open-source counterparts to Jev available, and one of the earliest non-TypeSafe\nentries into what [decision-models-overview](/wiki/topics/decision-models-overview/) treats as a category.\n\n**GitHub:** `github.com/NandhaKishorM/laya` · **HuggingFace:** `convaiinnovations/laya` · **PyPI:** `pip install laya`\n\n## Architecture\n\nThree checkpoints:\n\n| Checkpoint | Backbone | Parameters | Context |\n|---|---|---|---|\n| laya | ModernBERT-large | 421M | 512 tokens |\n| laya-multilingual | mmBERT-base | 322M | 1,024 tokens |\n| laya-typed-decisions | ModernBERT-large | 421M | 1,024 tokens |\n\nAnswer options are scored at `[MASK]` token positions and softmaxed — so the schema can change at\nruntime without retraining. A built-in Router detects input language in under 0.5ms and dispatches\nto the correct checkpoint. Training uses **RLCD** (Reinforcement Learning for Calibrated Decisions)\nagainst proper scoring rules — designed for calibrated probability output, not fluency.\n\n## Benchmarks\n\n**Latency (single question):**\n\n| Hardware | Laya | Jev |\n|---|---|---|\n| Tesla T4 | 32.8ms | 236–276ms p50 |\n| RTX 5090 | 9ms | 239ms |\n| Apple M3 Max | 13.4ms | N/A |\n\n**Accuracy:**\n\n| Benchmark | Laya | Jev | Notes |\n|---|---|---|---|\n| Typed-decisions (400 cases) | 0.766 | 0.727 | Laya is fine-tuned; comparison methodologies differ |\n| Banking77 (72 labels) | 0.425 | 0.870 | Laya major weakness: high-cardinality label spaces |\n| Phishing (independent, same hardware) | 0.611 / 0.678 AUROC | 0.626 / 0.689 | Near parity on narrow binary tasks |\n| Calibration ECE (post temperature scaling) | 0.081 | 0.246 | Lower = better calibrated |\n| **Zero-shot (no fine-tuning)** | **~0.362** | **~0.727** | Critical gap: Laya near chance without fine-tuning |\n\n## Limitations\n\n1. **Zero-shot performance near chance** (~0.362). Jev appears competitive zero-shot; Laya requires\n   task-specific fine-tuning data and RLCD training runs to reach comparable accuracy.\n2. **High-cardinality label spaces collapse accuracy** (Banking77, 72 labels: 0.425 vs Jev's 0.870).\n   Workaround requires manual `head_max_len` tuning; ~20 options recommended as default maximum.\n3. **Ordinal score primitive is the weakest** (~0.372 on SST-5).\n4. **Ships overconfident** — raw ECE 0.466 before post-hoc temperature scaling (drops to 0.081\n   after). Calibration step is required.\n5. **English checkpoint silently fails on non-English input** — scores 0.000 on Khmer with 95.2%\n   confidence. Multilingual routing is mandatory for production.\n6. **Infrastructure overhead** — GPU or Apple Silicon for latency benefits; CPU inference is possible\n   but significantly slower.\n\n## Laya vs Jev — full comparison\n\n| Dimension | Laya | Jev |\n|---|---|---|\n| Open-source | **Yes** (Apache 2.0) | No (closed-source) |\n| Local hosting | **Yes** (\u003c1GB English checkpoint) | No (API-only) |\n| Output primitives | choice / score / noul | Choice / Score / Noul |\n| Zero-shot accuracy | ~0.362 (near random) | ~0.727 |\n| Fine-tuned accuracy | 0.766 (task-specific) | 0.727 (generic) |\n| High-cardinality (72 labels) | 0.425 | **0.870** |\n| Latency p50 | **32.8ms (T4)** | 236–276ms |\n| JaaJ experiment latency | N/A | 0.44s (incl. network) |\n| Per-query cost | **$0** (self-hosted) | ~$0.00035/call |\n| Calibration ECE | **0.081** (post-scaling) | 0.246 |\n| Architecture | BERT encoder + RLCD | Unknown (closed) |\n| Parameters | 421M / 322M | Unknown |\n| Multilingual | **Yes** (100+ languages) | Unknown |\n| Fine-tuning required | Yes, for competitive accuracy | No |\n| Infrastructure required | Yes (GPU preferred) | No (managed API) |\n| License | Apache 2.0 | Commercial |\n\nFor how Laya now compares against the newer entrants (AWS Strands Decider 2B, OpenAI Decisions API),\nsee the cross-vendor table in [decision-models-overview](/wiki/topics/decision-models-overview/#cross-vendor-comparison-as-of-2026-10-03).\n\n## When to use each\n\n**Reach for Laya when:**\n- The task is well-defined, bounded, and you can curate fine-tuning data (50–500 labeled examples).\n- Per-call cost at scale is the binding constraint, or the eval must run in an air-gapped / private\n  environment.\n- Latency is more important than zero-shot readiness — Laya is 7–8× faster than Jev at the model\n  level.\n- You need multilingual coverage across 100+ languages.\n\n**Reach for Jev when:**\n- You need competitive accuracy immediately, without fine-tuning infrastructure or labeled data.\n- The label space is large (>20 options) — Laya's accuracy degrades sharply here.\n- The use case is heterogeneous or schema changes frequently — Jev handles arbitrary schemas out of\n  the box.\n- You prefer a fully managed, no-ops API over running your own inference stack.\n\nThe zero-shot gap (Laya 0.362 vs Jev 0.727) is the most operationally significant difference. For\nteams with established eval tasks and labeled data, fine-tuned Laya equals or beats Jev at a\nfraction of the per-call cost and latency. For teams standing up evals quickly or covering diverse\nschemas, Jev's zero-shot strength is the decisive advantage.\n\n## Related pages\n\n- [decision-models-overview](/wiki/topics/decision-models-overview/) — category hub: cross-vendor comparison,\n  two architectural schools, decision guide\n- [typesafe-ai-system-one](/wiki/topics/typesafe-ai-system-one/) — Jev internals\n- [jev-as-a-judge-evals](/wiki/topics/jev-as-a-judge-evals/) — Jev as an agent-eval judge\n- [aws-strands-decider](/wiki/topics/aws-strands-decider/) — a second open-weight alternative, newer and with a\n  fully open training recipe (not just weights)\n\n## Sources\n\n- Zima Space — [Laya: Open-Source Decision Model for Local AI](https://shop.zimaspace.com/blogs/tech-ai-hub/laya-open-source-decision-model-local-ai), retrieved 2026-09-23\n- Laya GitHub: `github.com/NandhaKishorM/laya` · HuggingFace: `convaiinnovations/laya`, retrieved 2026-09-23\n";</script>
