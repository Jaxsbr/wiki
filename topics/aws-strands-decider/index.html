<script>window.__MD__ = "# AWS Strands Decider 2B\n\n> Ingested 2026-10-03 from The New Stack, MarkTechPost, thelettertwo.com, sqmagazine.co.uk, and the\n> `strands-labs/strands-decider` GitHub repository (README + `evaluation/jevbench.md`).\n> Part of the [decision-models-overview](/wiki/topics/decision-models-overview/) category; see that page for\n> cross-vendor comparison against Jev, Laya, and OpenAI's Decisions API.\n\n## What it is\n\nStrands Decider 2B is an open-weight, locally-hostable **decision model** released by AWS Strands\nLabs on 2026-10-01. It answers closed-set questions (pick one option, score on a rubric, yes/no\nprobability) about a piece of text in a single forward pass, with a calibrated confidence value —\nthe same interface contract as TypeSafe's Jev, but open-source and designed to run on a single\nconsumer GPU or even CPU.\n\nModel identifier: `StrandsAgents/strands-decider-2B-hobson-v19`. Released version is **v19**; an\nearlier \"slot-head\" design performed significantly worse and was superseded.\n\n## Origin story\n\nAWS distinguished engineer **Marc Brooker** saw TypeSafe's Jev (launched ~2026-09-15) and built his\nown version as a side project. The prototype briefly reached the top of the JevBench leaderboard\namong models of its size class before being overtaken by subsequent entrants — the public v19\nrelease placed 3rd of 33 in the 2B class on the v1.4.2 board. The article frames decision models as\nhaving \"become a category\" only after Jev's launch, with Strands Decider arriving roughly two weeks\nlater as one of the first serious open-source responses.\n\n## Architecture\n\nStrands Decider starts from **Qwen3.5-2B-Base** and modifies it specifically to remove its ability\nto generate text:\n\n1. **Remove the LM head.** The stock language-modeling head (which turns hidden states into a\n   probability distribution over the vocabulary, i.e. \"the next word\") is deleted. This is what\n   makes the model architecturally incapable of generating free text — there is no generation path\n   to fall back on, correctly or incorrectly.\n2. **Replace it with a pointer head.** A lightweight scoring component of just over **1 million\n   parameters**, run in **fp32**. It works by comparing the hidden state at a special `\u003canswer>`\n   token position against the hidden states at each candidate answer option's final token, and\n   scoring the match — a pointer mechanism, not a generation mechanism.\n3. **Adapt with LoRA.** Rather than retraining the full 1.9B-parameter base model, training uses a\n   **rank-16 LoRA adapter** (Low-Rank Adaptation) — a small add-on layer — on top of the frozen\n   Qwen3.5-2B-Base weights.\n\nTotal parameters: **1.9 billion** (the Qwen3.5-2B-Base backbone, with ~1M of those in the new\npointer head). Because there is no autoregressive decoding loop, **one forward pass yields the\nresult** — which also makes it straightforward to batch multiple questions over the same input text\nin a single pass.\n\n## Question types\n\nSame three-primitive shape as Jev and Laya, confirming the pattern is converging across vendors\nindependently:\n\n| Type | Shape | Example (CLI) |\n|---|---|---|\n| `choice` | Pick 1 of N options | `--choice \"Which team should handle this?=billing,sales,retail\"` |\n| `noul` | Yes/No as a 0–1 probability | `--noul \"Does this convey urgency?\"` |\n| `score` | Rate on an ordered rubric | `--score \"How frustrated is the writer?=calm,frustrated,depressed\"` |\n\n## Usage\n\nInstall:\n\n```bash\npip install strands-decider\n```\n\nCLI, single question:\n\n```bash\nstrands-decider ask StrandsAgents/strands-decider-2B-hobson-v19 \\\n  --state \"Help! My payouts have been failing for 3 days!\" \\\n  --choice \"Which team should handle this?=billing,sales,retail\"\n# -> choice_0 -> billing (confidence 0.768)\n```\n\nServer mode (OpenAI/TypeSafe-shaped HTTP API):\n\n```bash\nstrands-decider serve StrandsAgents/strands-decider-2B-hobson-v19 --port 8000\ncurl localhost:8000/v1/systemone -H 'content-type: application/json' \\\n  -d '{\"state\": \"...\", \"questions\": {\"is_urgent\": {\"type\": \"noul\", ...}}}'\n```\n\nThe server **binds to 127.0.0.1 with no built-in authentication** — production deployment needs its\nown auth layer in front of it. There is also **no hosted inference provider** for it yet; it's\nself-host only.\n\n## JevBench performance\n\nBenchmarked on the JevBench v1.4.2 board (89 ranked systems total; 33 in the \"2B class\"):\n\n| Metric | Result |\n|---|---|\n| Public accuracy | 0.723 (167–169 of 231 tasks, reported slightly differently across sources) |\n| Overall rank | 50th of 89 overall; 3rd of 33 in the 2B class; 1st of 30 2B-class models with a full public training recipe |\n| Easy tier | 1.000 (100%) |\n| Standard tier | 0.875 |\n| Hard tier | 0.505 |\n| Brier score | 0.342 |\n| Expected calibration error (ECE) | 0.052 |\n\nCalibration claim: on unseen short classification tasks, \"answers at 0.9 confidence or higher were\nright about 95% of the time.\" Accuracy degrades sharply from easy → hard tiers (1.00 → 0.875 →\n0.505), the same jaggedness pattern documented for Jev and Laya elsewhere in this wiki — treat\nconfidence and task-tier as inseparable when deciding whether to automate on a given answer.\n\n## Latency\n\n| Hardware | Median latency |\n|---|---|\n| Nvidia RTX 3090 | ~115ms (p95: 299ms) |\n| Apple M3 Pro | ~153ms (warm, under 300 tokens) |\n\nLatency scales with task size (more questions / longer state → slower), and the GPU numbers are\nsubstantially faster than Jev's measured production p50 of 210ms, though the comparison is apples-\nto-oranges: Strands Decider's number is a local single-GPU forward pass, Jev's is a network round\ntrip to a hosted API (see [decision-models-overview](/wiki/topics/decision-models-overview/) for the full\ncross-vendor latency table and its caveats).\n\n## Strands Agents integration\n\nStrands Decider is designed to plug into the **Strands Agents** framework via **intervention\nhandlers** — a `before_tool_call` handler can return one of **Proceed, Deny, Confirm, or Guide**\nbefore a tool actually executes. The documented example gates a weather-tool call behind yes/no\n`noul` questions checking whether the tool's arguments are grounded in the conversation and whether\nthe timing is appropriate — i.e. the decision model sits exactly at \"layer 3\" of the five-layer\nagent stack described in [decision-models-overview](/wiki/topics/decision-models-overview/#where-a-decision-model-sits-in-an-agents-stack),\ngating layer 5 (action) before it executes.\n\nOther documented use cases: model routing, tool selection, argument checking, triage, guardrails,\nevals, hybrid agents, memory, context management, policy classification.\n\n## Competitive field\n\nThe article identifies Strands Decider 2B as one of several small open decision models now\ncompeting on JevBench in the same size class:\n\n| Model | Vendor | JevBench accuracy |\n|---|---|---|\n| Strands Decider 2B (v19) | AWS Strands Labs | 0.723 (167/231) |\n| `decider-2b` (v11) | Mapika | 0.710 on vendor's own harness; **175/231 (8 tasks ahead)** on the Strands harness |\n| `Decision 2B` | FlyMy.AI | referenced, not independently detailed in sources reviewed |\n\nMapika's newer v11 release scoring ahead of Strands Decider on the same harness is itself evidence\nof how fast this sub-field is moving — benchmark position here should be read as a snapshot, not a\nsettled ranking.\n\n## Licensing and reproducibility\n\n- **License:** Apache 2.0 — fully open, including training data and training scripts (not just\n  inference weights).\n- **Repository:** `github.com/strands-labs/strands-decider` — includes `training/README.md` to\n  reproduce the model from scratch and `data/sources.md` documenting data provenance and licenses\n  for every training source.\n- **Weights:** Hugging Face, `StrandsAgents/strands-decider-2B-hobson-v19`.\n\nThis is a meaningfully more open release than Jev (closed weights, undisclosed architecture) and\non par with Laya's Apache 2.0 openness, but at the \"full training recipe,\" not just \"open weights,\"\nlevel — closer to a research-reproducible release than a typical open-weight model drop.\n\n## Limitations\n\n- No built-in server authentication (operational, not architectural — straightforward to fix with a\n  reverse proxy, but not provided out of the box).\n- No hosted inference option — self-hosting is mandatory today.\n- Accuracy drops from 100% (easy) to ~50% (hard tier) on JevBench — same jaggedness profile as every\n  other model in this category; don't treat \"it's a decision model\" as a proxy for \"it's reliable\n  on hard tasks.\"\n- Text-only; no image/multimodal input (a vision-input PR was in progress in the repo but not part\n  of the v19 release reviewed here).\n- A fast-moving competitive field (Mapika's v11 already ahead on one harness) means these numbers\n  will likely be stale within weeks.\n\n## Sources\n\nAll retrieved 2026-10-03.\n\n- The New Stack — [AWS launches a local answer to TypeSafe's Jev decision model](https://thenewstack.io/aws-strands-decider-model/), Frederic Lardinois, Oct 1 2026\n- MarkTechPost — [AWS Strands Labs Releases Strands Decider 2B: An Open Source Decision Model That Picks Options in About 115 ms](https://www.marktechpost.com/2026/10/01/aws-strands-labs-releases-strands-decider-2b/)\n- thelettertwo.com — [AWS Strands Decider 2B Is a Small Decision Model for AI Agents](https://thelettertwo.com/2026/10/01/aws-strands-decider-2b/)\n- sqmagazine.co.uk — [Amazon's Strands Decider 2B Model Targets Faster AI Agents](https://sqmagazine.co.uk/amazon-strands-decider-2b-open-source-decision-model/)\n- GitHub — [`strands-labs/strands-decider`](https://github.com/strands-labs/strands-decider) README and [`evaluation/jevbench.md`](https://github.com/strands-labs/strands-decider/blob/main/evaluation/jevbench.md)\n";</script>
