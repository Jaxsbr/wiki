<script>window.__MD__ = "# Decision models: a category, not a vendor\n\n> Hub page. Created 2026-10-03 after AWS (Strands Decider 2B) and OpenAI (Decisions API) both\n> followed TypeSafe's Jev (Sep 2026) into the same space within two weeks. Updated 2026-10-14 to add\n> Wazn (Numid Labs) and vLLM Semantic Router's Decision 3.0 family. The pattern underneath all six —\n> Jev, Laya, Strands Decider, OpenAI Decisions API, Wazn, Decision 3.0 — matters more than any single\n> vendor's model. This page is the concept-first entry point; vendor pages hang off it.\n\n## The category, defined\n\nA **decision model** takes **state** (the material being judged — a message, a trace, a ticket,\na page of scraped text) plus a **bounded question** (a closed set of possible answers, defined by\nthe calling application, not the model) and returns a **typed answer with a calibrated confidence\nor probability** — not prose.\n\n```text\nstate + bounded question  →  decision model  →  typed answer + confidence  →  code decides what happens next\n```\n\nThis is a narrower, different job from what a general LLM does by default. An LLM asked the same\nquestion generates text first, and the application then parses that text into a decision:\n\n```text\nprompt → generated text → parser → schema validation → retry → action     (generative path)\nstate + bounded question → typed decision → policy check → action        (decision-model path)\n```\n\nThe generative path carries parsing failures, retries, and token cost that scale with explanation\nlength even though no one reads the explanation. The decision-model path is built to skip straight\nto the typed answer.\n\n## Why this surfaced as its own category now\n\nJev (TypeSafe AI, launched ~2026-09-15) was the first model marketed explicitly as a \"decision\nmodel\" rather than an LLM — see [typesafe-ai-system-one](/wiki/topics/typesafe-ai-system-one/). Within three\nweeks, the pattern was reproduced from two very different directions:\n\n- **AWS Strands Labs** shipped [Strands Decider 2B](/wiki/topics/aws-strands-decider/) (2026-10-01): a small,\n  open-weight, locally-hostable model built by replacing a stock LLM's text-generation head with a\n  scoring head. Built explicitly in response to seeing Jev (AWS distinguished engineer Marc Brooker's\n  prototype briefly topped JevBench for its size class).\n- **OpenAI** announced the [Decisions API](/wiki/topics/openai-decisions-api/) at DevDay 2026-09-29: not a new\n  model architecture, but a constrained, low-latency interface in front of GPT-6 Luna that only\n  answers bounded questions instead of generating free text.\n- **Laya** (Convai Innovations, ~2026-09-18) took a third route, already covered on its own page:\n  [laya-decision-model](/wiki/topics/laya-decision-model/) — a BERT-family bidirectional encoder repurposed for\n  typed decisions, predating the \"decision model\" label but matching the same contract.\n\nFour independent teams converged on the same interface contract (closed answer space in, typed\nanswer + confidence out) within about six weeks. That convergence — not any one vendor's benchmark\nwin — is the reason this is a wiki-level concept page rather than a subsection of the Jev page.\n\nTwo more arrived by mid-October, broadening the pattern further:\n\n- **Numid Labs** released [Wazn](/wiki/topics/wazn-decision-model/) (~2026-10, `v0.1`), an explicitly\n  experimental zero-shot decision model built around a frozen Qwen3.5-2B-Base backbone, a relational\n  judge head, and a dedicated \"NONE of these labels apply\" gate.\n- **vLLM Semantic Router** open-sourced [Decision 3.0](/wiki/topics/vllm-decision-3/) (2026-10-10/11): six\n  Apache-2.0 models from 0.59B to 26B params, the first in this category built by a routing project\n  for its own internal use rather than sold as a standalone product, and the first *purpose-built*\n  model in the category with confirmed image/video input.\n\nSix independent teams, three different motivations (sell a decision API, answer a competitor's\nlaunch, open-source an internal routing component), same interface contract. The category is not\nslowing down.\n\n## Two architectural schools\n\n| School | How it avoids free text | Members |\n|---|---|---|\n| **Purpose-built decision model** | No text-generation path exists in the model at all | Jev (closed, architecture undisclosed), Laya (BERT encoder, mask-token scoring), Strands Decider 2B (LM head removed, replaced with a ~1M-parameter pointer head), Wazn (frozen Qwen3.5-2B backbone + relational judge + NONE gate), Decision 3.0 (Qwen3.5/3.8 fine-tunes returning typed probabilities, no decode loop) |\n| **Constrained generative model** | The underlying LLM can still generate text, but the product/endpoint narrows it to one bounded choice | OpenAI Decisions API (a restricted GPT-6 Luna) |\n\nThe distinction matters operationally, not just philosophically:\n\n- A purpose-built model has no generation path to fall back on if the schema doesn't fit — it is\n  architecturally incapable of free text, which is also a limitation (no explanations, no partial\n  reasoning visible).\n- A constrained generative model inherits the parent LLM's broader capability (OpenAI's version\n  accepts images; Jev and Strands Decider are text-only) but also inherits generative-model cost\n  structure and failure modes unless the product layer genuinely prevents free-text output.\n\n## Where a decision model sits in an agent's stack\n\nBorrowing the framing from the OpenAI-vs-Jev comparison (see\n[openai-decisions-api](/wiki/topics/openai-decisions-api/#decision-models-as-a-category)), a decision model is\none layer in a five-layer agent stack, and the boundaries matter for auditability:\n\n```text\n1. Orchestrator\n2. Generative model   — planning, reasoning, prose\n3. Decision model      — route, risk, priority, completion  ← this category\n4. Policy / permissions\n5. Action / audit\n```\n\n\"Layer three should never quietly become layer four\" — the decision model's confidence score is\nevidence for a policy decision, not the policy decision itself. Every vendor page in this group\ndocuments the same caveat independently (TypeSafe: \"the threshold is not supplied by the model\";\nOpenAI: confidence is \"not proof\"; Strands Decider: calibration is measured, not guaranteed outside\nits training distribution).\n\n## Cross-vendor comparison (as of 2026-10-14)\n\n| Dimension | Jev (TypeSafe) | Laya (Convai) | Strands Decider 2B (AWS) | OpenAI Decisions API | Wazn (Numid Labs) | Decision 3.0 (vLLM-SR) |\n|---|---|---|---|---|---|---|\n| Architecture | Undisclosed, closed | ModernBERT/mmBERT encoder | Qwen3.5-2B-Base, LM head replaced with ~1M-param pointer head + rank-16 LoRA | Constrained GPT-6 Luna (still generative under the hood) | Frozen Qwen3.5-2B-Base + LoRA + relational judge + NONE gate (~43M head params) | Qwen3.5/3.8 fine-tunes, 6 sizes, dedicated vision encoder per size |\n| Parameters | Undisclosed | 421M / 322M | 1.9B total (~1M in the decision head) | Undisclosed (Luna-scale) | 2B backbone + 43M head | 0.59B–26.09B (6 checkpoints) |\n| Open weights | No | Yes (Apache 2.0) | Yes (Apache 2.0, full training recipe) | No | Yes (Apache 2.0 head; backbone keeps Qwen license) | Yes (Apache 2.0, all 6 sizes) |\n| Local hosting | No (hosted API only) | Yes | Yes (CLI + server, binds localhost, no built-in auth) | No (hosted preview only) | Yes (local server via `wazn-experimental`) | Yes (self-hosted via vLLM-SR stack) |\n| Question types | Choice / Score / Noul | choice / score / noul | choice / noul / score | \"Question with finite predefined answers\" (no named type system published) | Zero-shot label-set classification + NONE gate (no named Score/Noul primitive) | Choice / Noul / Score |\n| Multimodal input | Text only | Text only (100+ languages) | Text only | Text **and images** | Text only | Text, JSON, **images, and video** |\n| Context limit | 32K–64K tokens | 512–1,024 tokens | Not separately published (inherits Qwen3.5-2B context) | Not published | Not published | Not published (predecessor Decision 1.0 published 1,024/16,384; Decision 3.0 does not) |\n| Decoding | Vendor claims parallel sampler, no autoregressive generation | Single forward pass, `[MASK]`-token scoring | Single forward pass, no decode loop | Still an LLM call under the hood, just schema-constrained | Single pass for small label sets; tournament-style comparison for very large label sets (1,000+) | Single pass, typed probability output |\n| Latency (reference hardware) | 0.21s p50 / 0.34s p95 (measured, OpenRouter) | 9–33ms model-level (T4/RTX 5090/M3 Max) | 115ms p50 / 299ms p95 (RTX 3090); 153ms (M3 Pro) | ~150ms claimed vs 1.6s for unconstrained Luna (~10×) | 35ms (5 labels) / 317ms (1,000 labels, RTX 5090) | 55ms text / 273ms image (d3, MI325X); 6.7ms text (d3-edge) |\n| Cost | $0.042/M in, $0 out (no output tokens) | $0 (self-hosted) | $0 (self-hosted) | Undisclosed; inherits Luna's generative cost model unless discounted | $0 (self-hosted) | $0 (self-hosted) |\n| Calibration (ECE) | 0.246 (0.081 post temperature-scaling) | 0.081 post-scaling | 0.052 | Not published | Not published | Not published |\n| Accuracy benchmark | JaaJ: 100% oracle agreement (500 decisions, weather-agent eval) | Typed-decisions: 0.766 fine-tuned / ~0.362 zero-shot | JevBench v1.4.2: 0.723 public (167/231); 3rd of 33 in 2B class | Not independently benchmarked at time of writing | Not published at ingestion (card flags this as a gap) | Jev Decision Index v0.3.1: 65.5 (d3, flagship); 28.82–65.5 across the family — see note below on benchmark-name ambiguity |\n| Availability | GA, no waitlist | GA (pip/HF) | GA (pip/HF), Oct 1 2026 | Limited preview, selected customers only (403 for standard keys as of Oct 2) | Experimental / pre-production (`v0.1`) | GA (pip/HF), Oct 10–11 2026 |\n| License | Commercial | Apache 2.0 | Apache 2.0 | Proprietary/API ToS | Apache 2.0 (head only) | Apache 2.0 |\n\nSources for each row are in the respective vendor pages; this table is a synthesis, not independent\nre-measurement — the benchmarks are not all run on the same harness (JevBench, Jev Decision Index,\nand vendor-reported numbers differ in methodology; see each page's caveats, and the\n[benchmark-naming note](/wiki/topics/vllm-decision-3/#jev-decision-index-vs-jevbench--a-naming-note) on\n`vllm-decision-3` specifically).\n\n## JevBench as an emerging shared benchmark\n\nJevBench (the public leaderboard referenced by Strands Decider's benchmarking) is becoming the\nclosest thing this category has to a shared evaluation harness, with 33+ models in the \"2B class\"\nalone as of Oct 2026, including Strands Decider 2B, Mapika's `decider-2b`, and FlyMy.AI's\n`Decision 2B`. That a leaderboard already exists with dozens of competing small decision models is\nitself evidence this is a real, fast-moving category rather than a single company's marketing term.\nSee [aws-strands-decider](/wiki/topics/aws-strands-decider/#jevbench-performance) for the full tier breakdown.\n\n**Caution as of 2026-10-14:** a second, differently-named board — the **Jev Decision Index**\n(v0.3.1 as used by Decision 3.0's announcement) — has also emerged, and Jev's own score differs\nacross the two (0.723 on JevBench's scale vs 60.1 on the Jev Decision Index's). These do not appear\nto be the same benchmark under two names; they're likely independent community efforts that both\nchose \"Jev\" as their reference point. Don't compare a JevBench score against a Jev Decision Index\nscore directly — see [vllm-decision-3](/wiki/topics/vllm-decision-3/#jev-decision-index-vs-jevbench--a-naming-note)\nfor the full note. This wiki will reconcile the two (or confirm they stay distinct) on a future\ningest.\n\n## Shared use cases across every vendor page in this group\n\n- **Routing** — classify a request, pick a specialist model or queue, choose an agent's next tool.\n- **Tool-call gating** — verify an action is grounded, reversible, and policy-compliant before a\n  write/payment/delete executes (Strands Agents' `before_tool_call` intervention handlers are the\n  clearest worked example — see [aws-strands-decider](/wiki/topics/aws-strands-decider/#strands-agents-integration)).\n- **Moderation and guardrails** — jailbreak/injection detection, policy violation checks.\n- **Agent evaluation** — Jev-as-a-Judge is the deepest worked example; see\n  [jev-as-a-judge-evals](/wiki/topics/jev-as-a-judge-evals/).\n- **Triage and prioritization** — severity/urgency/frustration scoring on a defined scale.\n- **Context/retrieval filtering** — score passage relevance or page type before it reaches a\n  generative model, reinforcing [context-engineering](/wiki/topics/context-engineering/)'s \"filter first\" guidance.\n- **Model/backend routing** — [vllm-decision-3](/wiki/topics/vllm-decision-3/) is the clearest worked example:\n  a routing project built its own decision model specifically to choose which backend model handles\n  each inference request.\n- **Flexible, caller-defined label sets at inference time** — [wazn-decision-model](/wiki/topics/wazn-decision-model/)'s\n  explicit focus, including a dedicated \"none of these labels apply\" gate rather than a forced pick.\n\n## Decision guide\n\n- **Need it running today, self-hosted, no API key, and don't mind fine-tuning or accepting\n  weaker zero-shot accuracy?** → Laya or Strands Decider 2B.\n- **Need the best zero-shot accuracy across arbitrary/changing schemas, and a hosted API is\n  acceptable?** → Jev.\n- **Already deep in the OpenAI ecosystem and willing to build on a limited, mutable preview with\n  undocumented pricing, in exchange for image input?** → OpenAI Decisions API (experiments only, per\n  its own vendor caveats — see [openai-decisions-api](/wiki/topics/openai-decisions-api/#recommendation)).\n- **Large label space (>20 options) or heterogeneous/frequently-changing schemas?** → Jev, OpenAI\n  Decisions API, or Wazn's tournament mode (tested to 1,000 labels); the encoder-based open models\n  (Laya, Strands Decider) degrade sharply on high-cardinality tasks.\n- **Need image or video input on a self-hosted, purpose-built (non-generative) model?** →\n  Decision 3.0 — currently the only purpose-built model in this category with confirmed multimodal\n  input; pick a size (0.59B–26B) to trade accuracy for latency.\n- **Need the smallest possible footprint for edge/on-device use?** → Decision 3.0's `d3-edge`\n  (0.59B, 6.7ms text latency) is the smallest model in the category as of 2026-10-14.\n- **Evaluating something brand new or pre-production and comfortable with that risk?** → Wazn is\n  explicitly experimental by its own documentation — treat it as a research preview, not a\n  production dependency, until it publishes benchmark numbers.\n- **Whatever vendor you pick:** keep the decision model at layer 3, not layer 4. It supplies\n  evidence; code owns the policy and the action.\n\n## Related pages\n\n- [typesafe-ai-system-one](/wiki/topics/typesafe-ai-system-one/) — Jev internals, deepest treatment of the\n  primitive design (Choice/Score/Noul) and calibration theory in this wiki\n- [jev-as-a-judge-evals](/wiki/topics/jev-as-a-judge-evals/) — the deepest worked use case (agent evals) for\n  any model in this category\n- [laya-decision-model](/wiki/topics/laya-decision-model/) — open-weight BERT-based alternative\n- [aws-strands-decider](/wiki/topics/aws-strands-decider/) — open-weight pointer-head alternative, Strands\n  Agents integration\n- [openai-decisions-api](/wiki/topics/openai-decisions-api/) — constrained-LLM alternative, DevDay 2026\n- [wazn-decision-model](/wiki/topics/wazn-decision-model/) — experimental zero-shot label-set classifier,\n  frozen-backbone + relational-judge + NONE-gate architecture\n- [vllm-decision-3](/wiki/topics/vllm-decision-3/) — six-size open multimodal family from a routing project,\n  the first purpose-built model in this category with image/video input\n- [agentic-landscape](/wiki/topics/agentic-landscape/) — decision models as one tool family within the\n  broader agentic tooling landscape\n- [context-engineering](/wiki/topics/context-engineering/) — \"filter first\" context assembly, a natural\n  consumer of decision-model scoring\n\n## Sources\n\nRetrieved 2026-10-03 (Jev/Laya/Strands Decider/OpenAI) and 2026-10-14 (Wazn/Decision 3.0 addition).\n\n- The New Stack — [AWS launches a local answer to TypeSafe's Jev decision model](https://thenewstack.io/aws-strands-decider-model/), Frederic Lardinois, Oct 1 2026\n- Firecrawl — [OpenAI's Decisions API vs Jev: Inside the Decision-Model Architecture](https://www.firecrawl.dev/blog/openai-decisions-api-vs-jev)\n- See [aws-strands-decider](/wiki/topics/aws-strands-decider/#sources), [openai-decisions-api](/wiki/topics/openai-decisions-api/#sources),\n  [wazn-decision-model](/wiki/topics/wazn-decision-model/#sources), and [vllm-decision-3](/wiki/topics/vllm-decision-3/#sources)\n  for full per-vendor source lists\n";</script>
