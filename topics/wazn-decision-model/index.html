<script>window.__MD__ = "# Wazn — experimental zero-shot decision model\n\n> Ingested 2026-10-14 from the Hugging Face model card (`numidlabs/wazn-2b-v0.1`), its GitHub\n> companion repo (`numid-ai/wazn-experimental`), and the Hacker News \"Show HN\" thread. Part of the\n> [decision-models-overview](/wiki/topics/decision-models-overview/) category — the \"purpose-built decision\n> model\" school, alongside Jev, Laya, and Strands Decider 2B.\n\n## What it is\n\nWazn (Numid Labs / Numid AI, released ~2026-10, version `v0.1`) is an experimental decision model\nbuilt for **zero-shot classification over flexible, caller-supplied label sets** — given a context,\noptional rules, and an instruction, it returns a probability distribution over whatever labels you\npass in at call time, each with an optional definition and few-shot examples, without generating\ntext.\n\nIts differentiator within this category is explicit flexibility of the label space at inference\ntime: most decision models (Jev's Choice type included) accept an arbitrary label set per call, but\nWazn's model card foregrounds this as the core design goal rather than a side effect, and ships an\nexplicit **NONE gate** — a dedicated mechanism for \"none of the supplied labels apply\" — rather than\nforcing a best-effort pick among bad options.\n\n## Architecture\n\nThree components layered on a frozen backbone:\n\n1. **Backbone** — Qwen3.5-2B-Base, frozen, with LoRA adapters used to encode candidate labels\n   (the backbone itself is not fully fine-tuned, unlike Strands Decider's approach of training a\n   LoRA adapter across the whole model for its pointer head).\n2. **Relational judge** — a head that compares the encoded context representation against each\n   candidate label's representation, producing a relative score per label.\n3. **NONE gate** — a separate head that estimates the probability that no supplied label is a valid\n   answer at all, surfaced as its own probability alongside the label distribution.\n\nCustom head parameters: **43,214,082** (~43M), on top of the frozen 2B Qwen3.5 backbone — roughly\n40× the size of Strands Decider's ~1M-parameter pointer head, reflecting the added complexity of the\nrelational-judge + NONE-gate design versus a single comparison head.\n\n## Question types supported\n\nUnlike Jev/Laya/Strands Decider's named `Choice` / `Score` / `Noul` primitives, Wazn's public\ndocumentation describes a single general contract: **zero-shot classification over a supplied label\nset**, with each label optionally carrying a free-text definition and few-shot examples. This reads\nas a generalization of `Choice` rather than a fourth primitive — there is no documented\nscale/ordinal (`Score`) type distinct from picking among an explicit list of levels-as-labels.\n\n## Usage\n\nInstalled via the `wazn-experimental` PyPI package (Python 3.11+), which runs as a local server:\n\n```bash\npip install wazn-experimental\n# starts a local server at http://127.0.0.1:8000\n```\n\nRequests are plain HTTP/Python calls specifying: context, an instruction, and a set of labels (each\nwith an optional definition). The response includes the selected label, a confidence score, the full\nprobability distribution across all supplied labels, and the NONE-gate probability.\n\n## Benchmarks\n\nThe model card itself does not publish accuracy numbers — as of ingestion the card explicitly flags\nthis as a documentation gap (\"TODO: known weak spots, training data summary, evaluation results\").\nNo JevBench, Jev Decision Index, or other third-party benchmark entry was found for Wazn at ingestion\ntime. Treat any accuracy comparison against Jev/Laya/Strands Decider/Decision 3.0 as unverified until\na benchmark entry appears.\n\n## Latency\n\nBenchmarked on an NVIDIA RTX 5090:\n\n| Configuration | Median latency |\n|---|---|\n| Normal context, 5 labels | 35ms |\n| 1,000 labels (tournament-style comparison) | 317ms |\n\nThe \"tournament\" mode for very large label counts (1,000) is notable — it implies Wazn does not\nnaively score every label against the context in one pass at that scale, instead running a\nbracket-style comparison process, which is the likely explanation for the latency growing with label\ncount rather than staying flat the way a single joint forward pass would.\n\n## Licensing\n\nSplit license, same pattern as Laya and Strands Decider: **head weights (the ~43M custom\nparameters) are Apache 2.0**; the frozen Qwen3.5-2B-Base backbone keeps its own (Qwen) license.\n\n## Status and limitations\n\n- **Explicitly experimental** — the project describes itself as \"intended for trying out, not for\n  production use.\" This is a materially different maturity claim than Jev (GA), Laya (GA, pip/HF),\n  or Strands Decider 2B (GA, pip/HF) — Wazn is pre-release/research-stage by its own framing.\n- **No published benchmark numbers** at ingestion time — can't yet be placed on the\n  [cross-vendor comparison table](/wiki/topics/decision-models-overview/#cross-vendor-comparison-as-of-2026-10-03)\n  with verified accuracy/calibration figures.\n- **No named Score/Noul primitives documented** — unclear whether ordinal or binary questions are\n  modeled as a special case of the label-set contract or are simply unsupported.\n- Community reception: a \"Show HN\" thread exists but vote/comment counts were not captured at\n  ingestion.\n\n## Related pages\n\n- [decision-models-overview](/wiki/topics/decision-models-overview/) — category hub: cross-vendor comparison,\n  two architectural schools, decision guide\n- [aws-strands-decider](/wiki/topics/aws-strands-decider/) — closest architectural sibling: frozen/near-frozen\n  backbone + small trained head replacing a text-generation path\n- [laya-decision-model](/wiki/topics/laya-decision-model/) — another open-weight, Apache-2.0-licensed encoder\n  approach with its own zero-shot-vs-fine-tuned tradeoff\n- [vllm-decision-3](/wiki/topics/vllm-decision-3/) — a second new entrant from the same ingestion pass (2026-10-14)\n\n## Sources\n\nRetrieved 2026-10-14.\n\n- Hugging Face model card — [numidlabs/wazn-2b-v0.1](https://huggingface.co/numidlabs/wazn-2b-v0.1)\n- GitHub — [numid-ai/wazn-experimental](https://github.com/numid-ai/wazn-experimental)\n- PyPI — [wazn-experimental](https://pypi.org/project/wazn-experimental/0.1.0a2/)\n- Hacker News — [Show HN: Wazn-2B](https://news.ycombinator.com/item?id=49952373)\n";</script>
