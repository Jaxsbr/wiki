<script>window.__MD__ = "# OpenAI Decisions API\n\n> Ingested 2026-10-03 from Neowin, the-decoder, the Hugging Face explainer blog, and Firecrawl's\n> detailed OpenAI-vs-Jev technical comparison. Part of the\n> [decision-models-overview](/wiki/topics/decision-models-overview/) category — the \"constrained generative\n> model\" school, contrasted with purpose-built decision models (Jev, Laya, Strands Decider 2B).\n\n## What it is\n\nAnnounced at OpenAI DevDay on **2026-09-29**, the Decisions API is not a new model architecture —\nit's a product layer that takes **GPT-6 Luna** (OpenAI's low-cost model tier) and restricts it to\nanswering a single bounded question per call: context (text or images) plus a developer-defined\nquestion with a finite list of predefined answers, returning one answer with a confidence score.\n\n```text\ndecision = f(context, question, allowed_answers)\n```\n\nOpenAI's own framing: it \"enables real-time decision-making by focusing Luna's intelligence on a\nspecific set of user-defined questions with finite pre-defined answers.\"\n\n## How it differs from a normal Luna call\n\nThe model underneath is still GPT-6 Luna — a specialized, narrowed version of it, not a separate\ndecision-model architecture. This is the key architectural distinction from Jev, Laya, and Strands\nDecider, all three of which remove or never had a text-generation path at all. OpenAI is narrowing\na generative model's job rather than building a non-generative one. See\n[decision-models-overview](/wiki/topics/decision-models-overview/#two-architectural-schools) for why this\ndistinction has operational consequences, not just philosophical ones.\n\n## Performance claims\n\n| Metric | Decisions API | Regular GPT-6 Luna |\n|---|---|---|\n| Latency | ~150ms (vendor claim) | ~1.6s |\n| Speedup | ~10× | baseline |\n\nOpenAI's 150ms figure is a vendor claim under unstated conditions (hardware, context length, network\npath not published) — unlike Jev's comparable 210ms p50, which is measured production telemetry via\nOpenRouter. Treat the two numbers as not directly comparable until OpenAI publishes a methodology.\n\n## Input / output\n\n- **Input:** context as text **or images** (the only model in this category's comparison table with\n  confirmed multimodal input — confirmed via a computer-use-agent demo).\n- **Output:** one selected answer from the developer's predefined list, plus a confidence score.\n- **No named type system published** — unlike Jev/Laya/Strands Decider's explicit Choice/Score/Noul\n  (or choice/score/noul) primitives, OpenAI has not documented separate question \"types\"; everything\n  is framed as \"a question with finite predefined answers.\"\n- **No published schema.** As of 2026-09-30, OpenAI had published no request schema, response\n  schema, endpoint path, SDK method, or pricing. As of 2026-10-02, a standard API key still returned\n  a 403 (\"Decision API is not enabled for this user\"); there was no public docs page.\n\n## Use cases (as announced)\n\n- Classification and routing — support tickets, moderation categories, document types.\n- Agent next-step selection from a bounded action set.\n- Tool-call gates before sensitive operations (payments, deletions) — the same \"layer 3 gates layer\n  5\" pattern documented for Strands Decider's intervention handlers.\n- Model routing / cost control — deciding which (more expensive) model tier a task actually needs.\n- Triage and prioritization on a consistent scale.\n- Visual decisions using image context — the one use case this model can do that the purpose-built\n  decision models in this category currently cannot.\n\n## Decision models as a category\n\nOpenAI's own framing (via the Firecrawl comparison piece) explicitly names the problem this product\ntargets: many of an agent's turns are small bounded questions (which tool to call next, whether a\npage is relevant, whether an action needs confirmation, which model tier can handle a task), and\nnone of them need prose — but a default chat model answers each one with generated text anyway,\nadding a parse → validate → retry step that a typed decision skips. This is the same five-layer\nagent-stack argument summarized in\n[decision-models-overview](/wiki/topics/decision-models-overview/#where-a-decision-model-sits-in-an-agents-stack):\n\n```text\n1. Orchestrator\n2. Generative model   — planning, reasoning\n3. Decision model      — route, risk, priority, completion\n4. Policy and permissions\n5. Action and audit\n```\n\nWith the explicit warning that \"layer three should never quietly become layer four\" — a decision\nmodel's confidence score is evidence for a policy decision, not the policy decision itself.\n\n## Detailed comparison vs. Jev (Firecrawl's analysis)\n\n| Dimension | OpenAI Decisions API | TypeSafe Jev |\n|---|---|---|\n| Availability | Limited preview, selected customers | GA, no waitlist |\n| Question types | \"Finite pre-defined answers\" (untyped) | Choice, Score, Noul (mixable per call) |\n| Input format | Text or images | Text only (string, JSON, array) |\n| Context limit | Not published | 32K–64K tokens |\n| Response data | Not documented beyond \"confidence score\" | Per-option probabilities + confidence |\n| Public schema | None published | Fully documented |\n| Generative capability | Underlying model retains text generation | Architecturally cannot generate text |\n| Pricing (list, for context) | GPT-6 Luna: $0.10/M in, $0.50/M out | $0.042/M in, $0 out (no output tokens billed) |\n\nFirecrawl's framing of the core distinction: \"Constrained LLM versus purpose-built model. OpenAI is\nnarrowing a generative model's job.\" Jev's zero output-token cost follows directly from never\ngenerating text in the first place — a structural cost advantage a constrained-but-still-generative\nmodel can't fully replicate even if it stops emitting long explanations.\n\n## Community reception\n\nJev launched 2026-09-15; OpenAI's Decisions API announcement came 14 days later and drew markedly\nless organic engagement (6 Hacker News points vs. 691 for \"Jev in 25 Lines of Python\"). TypeSafe\nfounder Diogo Almeida's response to the OpenAI announcement drew 647 likes — read by the Firecrawl\npiece as the community treating OpenAI's entry as validation of the category rather than a\ncategory-killer, consistent with Strands Decider's near-simultaneous arrival from a third direction.\n\n## Recommendation\n\nPer the Firecrawl analysis: for production use today, OpenAI's Decisions API should be treated as\n\"only behind an adapter, and only for experiments you can afford to rewrite\" — access is preview-\nonly, and endpoint naming, response semantics, limits, and pricing can all still change before broad\nrelease. \"For a decision layer you can ship this week,\" the GA alternatives (Jev hosted, or\nLaya/Strands Decider self-hosted) are the more stable choice as of this writing.\n\n## Caveats\n\n- Confidence scores are not proof of correctness — must be layered with deterministic policy and,\n  for high-stakes actions, a human approval gate.\n- Production automation requires measuring false-positive/negative rates and calibration across\n  real customer segments before trusting the API's output directly.\n- Every detail here (schema, pricing, limits, even whether it remains GPT-6-Luna-based) is subject\n  to change before general availability — this page should be re-ingested once OpenAI publishes\n  formal docs.\n\n## Sources\n\nAll retrieved 2026-10-03.\n\n- Neowin — [OpenAI unveils $500 ChatGPT Pro plan, Decisions API, and major Codex upgrades at DevDay 2026](https://www.neowin.net/news/openai-unveils-500-chatgpt-pro-plan-decisions-api-and-major-codex-upgrades-at-devday-2026/)\n- the-decoder — [OpenAI expands Codex and its API at DevDay with security scans, a Decisions API, and Ultrafast](https://the-decoder.com/openai-expands-codex-and-its-api-at-devday-with-security-scans-a-decisions-api-and-ultrafast/)\n- Hugging Face blog — [What Is OpenAI Decisions API? A Practical Guide](https://huggingface.co/blog/sora-2/what-is-openai-decisions-api-a-practical-guide)\n- Firecrawl — [OpenAI's Decisions API vs Jev: Inside the Decision-Model Architecture](https://www.firecrawl.dev/blog/openai-decisions-api-vs-jev)\n- eesel.ai — [OpenAI Decisions API explained: how it works and who it's for](https://www.eesel.ai/blog/openai-decisions-api) (referenced via search, not independently fetched)\n";</script>
