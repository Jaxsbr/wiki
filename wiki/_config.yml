title: ver-kyker Research Wiki
description: Jaco's personal research wiki — concepts, topics, and annotated demos.
baseurl: ""
url: ""

theme: minima

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - "*.sh"
  - "Gemfile"
  - "Gemfile.lock"
  - ".gitignore"
